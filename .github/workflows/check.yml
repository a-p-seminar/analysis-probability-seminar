name: Manual application checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        default: failed-regressions
        options:
          - failed-regressions
          - all-checks
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.scope == 'all-checks'
        run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify archive filtering and uploaded Unicode attachment paths
        if: inputs.scope == 'failed-regressions'
        run: pnpm test:e2e tests/e2e/archive.spec.mjs --grep 'archive renders every source record|admin publishes full records'
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Browser tests with isolated server state per spec
        if: inputs.scope == 'all-checks'
        run: |
          for spec in tests/e2e/*.spec.mjs; do
            pnpm test:e2e "$spec"
          done
        env:
          PLAYWRIGHT_CHANNEL: chromium
