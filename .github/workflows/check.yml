name: Check application
on:
  push:
    paths-ignore:
      - 'content/**'
      - 'attachments/**'
      - 'sources/**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests with isolated server state per spec
        run: |
          for spec in tests/e2e/*.spec.mjs; do
            pnpm test:e2e "$spec"
          done
        env:
          PLAYWRIGHT_CHANNEL: chromium
