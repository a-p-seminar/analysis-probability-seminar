services:
  - type: web
    name: ap-whucc
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/a-p-seminar/analysis-probability-seminar
    branch: main
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 build
    startCommand: node scripts/render-server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - content/**
        - attachments/**
        - sources/**
        - docs/**
        - README.md
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GITHUB_OWNER
        value: a-p-seminar
      - key: GITHUB_REPO
        value: analysis-probability-seminar
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RENDER_ENV_TOKEN
        sync: false
